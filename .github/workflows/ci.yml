name: CI

on:
  push:
    branches: ["main", "master", "1.*/develop", "1.*/release"]
  pull_request:
    branches: ["main", "master", "1.*/develop", "1.*/release"]

permissions:
  contents: read

jobs:
  build:
    name: Build (no tags)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22.x", "1.23.x", "1.24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go build (without miniredis tag)
        run: go build ./...

  unit-test:
    name: Unit tests (no Redis required)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22.x", "1.23.x", "1.24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Run unit tests with race detector
        run: go test -race -count=1 -timeout 2m ./...

  integration-test:
    name: Integration tests (Redis ${{ matrix.redis }} + Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.x"]
        redis: ["6", "7"]
    services:
      redis:
        image: redis:${{ matrix.redis }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Run integration tests with race detector
        env:
          REDIS_ADDR: 127.0.0.1:6379
        run: |
          go test -tags integration -race -count=1 -timeout 5m ./...

  test-miniredis:
    name: miniredis suite (no Redis required)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build with -tags redisson_miniredis
        run: go build -tags redisson_miniredis ./...
      - name: Run miniredis isolated test suite
        run: go test -tags 'miniredis_test redisson_miniredis' -race -count=1 -timeout 5m ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12
          args: --timeout=5m

  builder-check:
    name: Builder invariants (genbuilder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Run genbuilder -check
        run: go run ./cmd/genbuilder -check -v
