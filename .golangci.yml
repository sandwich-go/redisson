run:
  timeout: 5m
  tests: true
  # 跳过自动生成的命令字典与 optiongen 产物
  skip-files:
    - "cmd_gen\\.go$"
    - "gen_.*_optiongen\\.go$"

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - misspell
    - unconvert
    - bodyclose
    - nilerr
    - prealloc

linters-settings:
  staticcheck:
    checks: ["all", "-SA1019"] # SA1019 = deprecated；过滤掉避免 noise
  govet:
    enable-all: true
    disable:
      - fieldalignment

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - prealloc
  max-same-issues: 50
  max-issues-per-linter: 0
