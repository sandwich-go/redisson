version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - misspell
    - bodyclose
    - nilerr
  settings:
    govet:
      enable:
        - assign
        - atomic
        - bools
        - buildtag
        - composites
        - copylocks
        - directive
        - errorsas
        - httpresponse
        - loopclosure
        - lostcancel
        - nilfunc
        - printf
        - shift
        - stringintconv
        - structtag
        - tests
        - unmarshal
        - unreachable
        - unsafeptr
        - unusedresult
    staticcheck:
      # 仅启用真正影响正确性的检查；禁用风格类（命名/注释/简化建议）以避免大批量改动
      checks:
        - "SA*" # 静态分析正确性问题（bug / 资源泄漏等）
        - "-SA1019" # 忽略 deprecated 警告
        - "-SA9003" # empty branch
  exclusions:
    generated: lax
    paths:
      # 自动生成的命令字典与 optiongen 产物
      - cmd_gen\.go$
      - gen_.*_optiongen\.go$
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose

issues:
  max-issues-per-linter: 0
  max-same-issues: 50
