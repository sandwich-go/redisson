version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - misspell
    - bodyclose
    - nilerr
    - unconvert
    - prealloc
    - unused
  settings:
    govet:
      enable:
        - assign
        - atomic
        - bools
        - buildtag
        - composites
        - copylocks
        - directive
        - errorsas
        - httpresponse
        - loopclosure
        - lostcancel
        - nilfunc
        - printf
        - shift
        - stringintconv
        - structtag
        - tests
        - unmarshal
        - unreachable
        - unsafeptr
        - unusedresult
    staticcheck:
      # 启用 SA*（正确性）+ S1*（简化）+ ST1*（风格）+ QF*（quickfix）全集。
      checks:
        - "SA*"     # 静态分析正确性问题（bug / 资源泄漏等）
        - "S1*"     # 简化建议
        - "ST1*"    # 风格规范（含 ST1003 命名规范）
        - "QF*"     # quickfix 建议
        - "-SA1019" # 忽略 deprecated 警告
        - "-SA9003" # empty branch
        - "-ST1020" # comment on exported function（历史代码风格）
        - "-ST1021" # comment on exported type
        - "-ST1022" # comment on exported var
  exclusions:
    generated: lax
    paths:
      # 自动生成的命令字典与 optiongen 产物
      - cmd_gen\.go$
      - gen_.*_optiongen\.go$
      # 元工程工具（独立 main 程序，不属于库代码）
      - ^cmd/genbuilder/
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
          - prealloc
      # cmd_args*.go 是 rueidiscompat 类型适配器集合（已按命令族拆分），
      # 含部分目前未直接调用但属于公开命令结果型工厂；不当 unused 处理。
      - path: 'cmd_args.*\.go$'
        linters:
          - unused

issues:
  max-issues-per-linter: 0
  max-same-issues: 50
