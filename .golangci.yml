version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - misspell
    - bodyclose
    - nilerr
    - unconvert
    - prealloc
    - unused
  settings:
    govet:
      enable:
        - assign
        - atomic
        - bools
        - buildtag
        - composites
        - copylocks
        - directive
        - errorsas
        - httpresponse
        - loopclosure
        - lostcancel
        - nilfunc
        - printf
        - shift
        - stringintconv
        - structtag
        - tests
        - unmarshal
        - unreachable
        - unsafeptr
        - unusedresult
    staticcheck:
      # 仅启用真正影响正确性的检查；禁用风格类（命名/注释/简化建议）以避免大批量改动
      checks:
        - "SA*" # 静态分析正确性问题（bug / 资源泄漏等）
        - "-SA1019" # 忽略 deprecated 警告
        - "-SA9003" # empty branch
  exclusions:
    generated: lax
    paths:
      # 自动生成的命令字典与 optiongen 产物
      - cmd_gen\.go$
      - gen_.*_optiongen\.go$
      # 元工程工具（独立 main 程序，不属于库代码）
      - ^cmd/genbuilder/
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
          - prealloc
      # cmd_args.go 是 rueidiscompat 类型适配器集合，含部分目前未直接调用但属于
      # 公开命令结果型工厂；不当 unused 处理（同时 P3-10 builder 生成完成后会被启用）。
      - path: cmd_args\.go
        linters:
          - unused

issues:
  max-issues-per-linter: 0
  max-same-issues: 50
